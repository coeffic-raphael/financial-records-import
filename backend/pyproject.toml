[tool.ruff]
line-length = 100
target-version = "py311"

# Migration bodies are generated by Alembic; linting them means fighting the
# generator on every revision. alembic/env.py, which we wrote, stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
# The alembic/ directory at the project root makes ruff infer the alembic
# package as first-party; both settings are needed to correct that.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are excluded by DEFAULT, not merely marked. A bare `pytest` is what
# the README tells a reviewer to run, so it must never reach the network or
# spend money on an API call. Run them deliberately with: pytest -m live
addopts = "-q -m 'not live'"
markers = [
    "live: performs a real AI provider call; skipped automatically without an API key",
]
