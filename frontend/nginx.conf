server {
    listen 5173;
    root /usr/share/nginx/html;

    # Asset filenames carry a content hash, so a given file never changes.
    # A year of immutable caching costs nothing and is never wrong.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one file whose name never changes while its contents
    # do -- it points at the hashed bundle. Without this, a browser may serve a
    # cached copy without revalidating and keep loading yesterday's application
    # after a rebuild, which looks exactly like a deployment that did nothing.
    # The ETag makes revalidation a 304 in the common case.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The application routes on the client. Without this, reloading the page on
    # /batches/<id> asks nginx for a file that does not exist and gets a 404.
    location / {
        try_files $uri /index.html;
    }
}
